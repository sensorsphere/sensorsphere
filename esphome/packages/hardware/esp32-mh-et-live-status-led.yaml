substitutions:
  status_led_version: 0.1

text_sensor:
  - platform: template
    name: "Mod Version StatusLed"
    entity_category: diagnostic
    lambda: |-
      return "${status_led_version}";

output:
  - platform: gpio
    pin:
      number: GPIO2
      inverted: false
    id: status_led_output

light:
  - platform: binary
    id: status_led
    output: status_led_output
    internal: true

switch:
  - platform: template
    name: "Status LED Enabled"
    id: status_led_enabled
    icon: "mdi:led-on"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

    turn_off_action:
      - light.turn_off: status_led

interval:
  - interval: 1s
    then:
      - if:
          condition:
            switch.is_off: status_led_enabled

          then:
            - light.turn_off: status_led

          else:
            - if:
                condition:
                  not:
                    wifi.connected:

                then:
                  # WiFi KO:
                  # 1 blink / second
                  - light.turn_on: status_led
                  - delay: 500ms
                  - light.turn_off: status_led

                else:
                  - if:
                      condition:
                        not:
                          mqtt.connected:

                      then:
                        # WiFi OK / MQTT KO:
                        # 2 blinks / second
                        - light.turn_on: status_led
                        - delay: 150ms
                        - light.turn_off: status_led
                        - delay: 150ms
                        - light.turn_on: status_led
                        - delay: 150ms
                        - light.turn_off: status_led

                      else:
                        # WiFi + MQTT OK:
                        # short heartbeat
                        - light.turn_on: status_led
                        - delay: 50ms
                        - light.turn_off: status_led