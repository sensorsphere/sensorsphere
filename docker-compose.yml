services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sensorsphere-mosquitto
    restart: unless-stopped
    ports:
      - "100.64.0.8:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infrastructure/mosquitto/config:/mosquitto/config:ro
      - ./infrastructure/mosquitto/data:/mosquitto/data
      - ./infrastructure/mosquitto/log:/mosquitto/log
    networks:
      - backend

  timescaledb:
    image: timescale/timescaledb:2.21.3-pg17
    container_name: sensorsphere-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infrastructure/timescaledb/data:/var/lib/postgresql/data
      - ./infrastructure/timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - database

  ingestion-service:
    build:
      context: .
      dockerfile: apps/ingestion-service/Dockerfile

    container_name: sensorsphere-ingestion

    restart: unless-stopped

    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_TOPIC: sensors/#

      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      LOG_LEVEL: ${LOG_LEVEL:-info}

    depends_on:
      mosquitto:
        condition: service_started

      timescaledb:
        condition: service_healthy

    networks:
      - backend
      - database

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sensorsphere-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - backend
      - database

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: sensorsphere-frontend
    restart: unless-stopped
    networks:
      - frontend

  nginx:
    image: nginx:1.28-alpine
    container_name: sensorsphere-nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - frontend
      - backend

networks:
  frontend:
    name: sensorsphere-frontend
  backend:
    name: sensorsphere-backend
  database:
    name: sensorsphere-database
