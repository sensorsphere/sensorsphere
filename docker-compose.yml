services:

  migrations:
    image: ${SENSORSPHERE_IMAGE_REGISTRY:-ghcr.io}/${SENSORSPHERE_IMAGE_NAMESPACE:-sensorsphere}/sensorsphere-migrations:${SENSORSPHERE_MIGRATIONS_VERSION:-77}
    restart: "no"

    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sensorsphere}
      DB_USER: ${POSTGRES_USER:-sensorsphere}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined}
      MIGRATIONS_DIR: /migrations

    depends_on:
      timescaledb:
        condition: service_healthy

    networks:
      - database


  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_IMAGE_TAG:-2}
    restart: unless-stopped

    ports:
      - "${MQTT_BIND_ADDRESS:-0.0.0.0}:${MQTT_PORT:-1883}:1883"

    volumes:
      - ./infrastructure/mosquitto/config:/mosquitto/config:ro
      - ${DATA_ROOT:-./data}/mosquitto/data:/mosquitto/data
      - ${DATA_ROOT:-./data}/mosquitto/log:/mosquitto/log

    networks:
      - backend


  timescaledb:
    image: timescale/timescaledb:${TIMESCALEDB_IMAGE_TAG:-2.21.3-pg17}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sensorsphere}
      POSTGRES_USER: ${POSTGRES_USER:-sensorsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined}

    volumes:
      - ${DATA_ROOT:-./data}/timescaledb:/var/lib/postgresql/data
      - ./infrastructure/timescaledb/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sensorsphere} -d ${POSTGRES_DB:-sensorsphere}"
        ]
      interval: ${DB_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${DB_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${DB_HEALTHCHECK_RETRIES:-10}

    networks:
      - database


  ingestion-service:
    image: ${SENSORSPHERE_IMAGE_REGISTRY:-ghcr.io}/${SENSORSPHERE_IMAGE_NAMESPACE:-sensorsphere}/sensorsphere-ingestion-service:${SENSORSPHERE_INGESTION_VERSION:-1.0.0}

    restart: unless-stopped

    environment:
      MQTT_URL: ${MQTT_INTERNAL_URL:-mqtt://mosquitto:1883}
      MQTT_TOPIC: sensors/ble_gateway/+/sensor/+/state
      METRIC_ROUTING_MODE: active

      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sensorsphere}
      DB_USER: ${POSTGRES_USER:-sensorsphere}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined}

      LOG_LEVEL: ${LOG_LEVEL:-info}

    depends_on:
      mosquitto:
        condition: service_started

      migrations:
        condition: service_completed_successfully

    networks:
      - backend
      - database


  api:
    image: ${SENSORSPHERE_IMAGE_REGISTRY:-ghcr.io}/${SENSORSPHERE_IMAGE_NAMESPACE:-sensorsphere}/sensorsphere-api:${SENSORSPHERE_API_VERSION:-1.47.0}

    restart: unless-stopped

    environment:
      PORT: ${API_PORT:-3000}

      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sensorsphere}
      DB_USER: ${POSTGRES_USER:-sensorsphere}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      INSTANCE_NAME: ${INSTANCE_NAME:-SensorSphere}
      INSTANCE_NAME_COLOR: ${INSTANCE_NAME_COLOR:-}
      SENSORSPHERE_ENVIRONMENT: ${SENSORSPHERE_ENVIRONMENT:-DEFAULT}
      SENSORSPHERE_PROJECT_TODOS_ENABLED: ${SENSORSPHERE_PROJECT_TODOS_ENABLED:-false}
      SENSORSPHERE_AUTH_ENABLED: ${SENSORSPHERE_AUTH_ENABLED:-false}
      SENSORSPHERE_AUTH_DEV_ROLE_SWITCH_ENABLED: ${SENSORSPHERE_AUTH_DEV_ROLE_SWITCH_ENABLED:-false}
      SENSORSPHERE_AUTH_DEV_DEFAULT_ROLE: ${SENSORSPHERE_AUTH_DEV_DEFAULT_ROLE:-admin}
      SENSORSPHERE_AUTH_BOOTSTRAP_ADMIN_EMAIL: ${SENSORSPHERE_AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      SENSORSPHERE_PUBLIC_URL: ${SENSORSPHERE_PUBLIC_URL:-}
      SENSORSPHERE_AUTH_PROVIDERS: ${SENSORSPHERE_AUTH_PROVIDERS:-google}
      SENSORSPHERE_GOOGLE_CLIENT_ID: ${SENSORSPHERE_GOOGLE_CLIENT_ID:-}
      SENSORSPHERE_GOOGLE_CLIENT_SECRET: ${SENSORSPHERE_GOOGLE_CLIENT_SECRET:-}
      SENSORSPHERE_MICROSOFT_CLIENT_ID: ${SENSORSPHERE_MICROSOFT_CLIENT_ID:-}
      SENSORSPHERE_MICROSOFT_CLIENT_SECRET: ${SENSORSPHERE_MICROSOFT_CLIENT_SECRET:-}
      SENSORSPHERE_MICROSOFT_TENANT: ${SENSORSPHERE_MICROSOFT_TENANT:-common}
      SENSORSPHERE_STACK_VERSION: ${SENSORSPHERE_STACK_VERSION:-}
      SENSORSPHERE_INSTALL_HOST: ${SENSORSPHERE_INSTALL_HOST:-}
      SENSORSPHERE_INSTALL_DIR: ${SENSORSPHERE_INSTALL_DIR:-}
      SENSORSPHERE_COMPOSE_PROJECT: ${SENSORSPHERE_COMPOSE_PROJECT:-}
      SENSORSPHERE_INGESTION_VERSION: ${SENSORSPHERE_INGESTION_VERSION:-1.0.0}
      SENSORSPHERE_NGINX_VERSION: ${SENSORSPHERE_NGINX_VERSION:-1.0.0}
      SENSORSPHERE_NGINX_RELEASED_AT: ${SENSORSPHERE_NGINX_RELEASED_AT:-}
      SENSORSPHERE_MIGRATIONS_VERSION: ${SENSORSPHERE_MIGRATIONS_VERSION:-77}
      SENSORSPHERE_MIGRATIONS_RELEASED_AT: ${SENSORSPHERE_MIGRATIONS_RELEASED_AT:-}

      HISTORY_CONFIG_PATH: ${HISTORY_CONFIG_PATH:-/app/data/history-config.json}

    volumes:
      - ${DATA_ROOT:-./data}/app:/app/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: ${APP_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${APP_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${APP_HEALTHCHECK_RETRIES:-12}

    depends_on:
      migrations:
        condition: service_completed_successfully

    networks:
      - backend
      - database


  backup:
    image: ${SENSORSPHERE_IMAGE_REGISTRY:-ghcr.io}/${SENSORSPHERE_IMAGE_NAMESPACE:-sensorsphere}/sensorsphere-backup:${SENSORSPHERE_BACKUP_VERSION:-0.1.0}
    profiles:
      - backup

    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sensorsphere}
      DB_USER: ${POSTGRES_USER:-sensorsphere}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined}

      INSTANCE_NAME: ${INSTANCE_NAME:-SensorSphere}
      SENSORSPHERE_ENVIRONMENT: ${SENSORSPHERE_ENVIRONMENT:-DEFAULT}
      SENSORSPHERE_INSTALL_HOST: ${SENSORSPHERE_INSTALL_HOST:-}
      SENSORSPHERE_INSTALL_DIR: ${SENSORSPHERE_INSTALL_DIR:-}
      SENSORSPHERE_COMPOSE_PROJECT: ${SENSORSPHERE_COMPOSE_PROJECT:-}
      SENSORSPHERE_STACK_VERSION: ${SENSORSPHERE_STACK_VERSION:-}
      SENSORSPHERE_API_VERSION: ${SENSORSPHERE_API_VERSION:-}
      SENSORSPHERE_FRONTEND_VERSION: ${SENSORSPHERE_FRONTEND_VERSION:-}
      SENSORSPHERE_INGESTION_VERSION: ${SENSORSPHERE_INGESTION_VERSION:-}
      SENSORSPHERE_NGINX_VERSION: ${SENSORSPHERE_NGINX_VERSION:-}
      SENSORSPHERE_MIGRATIONS_VERSION: ${SENSORSPHERE_MIGRATIONS_VERSION:-}
      SENSORSPHERE_BACKUP_VERSION: ${SENSORSPHERE_BACKUP_VERSION:-0.1.0}
      SENSORSPHERE_IMAGE_REGISTRY: ${SENSORSPHERE_IMAGE_REGISTRY:-ghcr.io}
      SENSORSPHERE_IMAGE_NAMESPACE: ${SENSORSPHERE_IMAGE_NAMESPACE:-sensorsphere}

      BACKUP_ROOT: /backups
      BACKUP_STATE_ROOT: /state
      INSTANCE_ROOT: /instance
      APP_DATA_ROOT: /source/app
      MOSQUITTO_DATA_ROOT: /source/mosquitto
      SENSORSPHERE_BACKUP_RETENTION_DAILY: ${SENSORSPHERE_BACKUP_RETENTION_DAILY:-7}
      SENSORSPHERE_BACKUP_RETENTION_WEEKLY: ${SENSORSPHERE_BACKUP_RETENTION_WEEKLY:-4}
      SENSORSPHERE_BACKUP_RETENTION_MONTHLY: ${SENSORSPHERE_BACKUP_RETENTION_MONTHLY:-6}
      SENSORSPHERE_BACKUP_WARNING_AGE_HOURS: ${SENSORSPHERE_BACKUP_WARNING_AGE_HOURS:-26}
      SENSORSPHERE_BACKUP_CRITICAL_AGE_HOURS: ${SENSORSPHERE_BACKUP_CRITICAL_AGE_HOURS:-48}

    volumes:
      - .:/instance:ro
      - ${DATA_ROOT:-./data}/app:/source/app:ro
      - ${DATA_ROOT:-./data}/mosquitto:/source/mosquitto:ro
      - ${SENSORSPHERE_BACKUP_ROOT:-./backups}:/backups
      - ${SENSORSPHERE_BACKUP_STATE_ROOT:-./data/backup-state}:/state

    depends_on:
      timescaledb:
        condition: service_healthy

    networks:
      - database


  frontend:
    image: ${SENSORSPHERE_IMAGE_REGISTRY:-ghcr.io}/${SENSORSPHERE_IMAGE_NAMESPACE:-sensorsphere}/sensorsphere-frontend:${SENSORSPHERE_FRONTEND_VERSION:-1.86.0}

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: ${APP_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${APP_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${APP_HEALTHCHECK_RETRIES:-12}

    networks:
      - frontend


  nginx:
    image: ${SENSORSPHERE_IMAGE_REGISTRY:-ghcr.io}/${SENSORSPHERE_IMAGE_NAMESPACE:-sensorsphere}/sensorsphere-nginx:${SENSORSPHERE_NGINX_VERSION:-1.0.0}
    restart: unless-stopped

    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: ${APP_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${APP_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${APP_HEALTHCHECK_RETRIES:-12}

    depends_on:
      - api
      - frontend

    networks:
      - frontend
      - backend


networks:
  frontend:
  backend:
  database: